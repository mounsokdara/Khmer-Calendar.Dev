  <style>
    html, body { height: 100%; margin: 0; background: #9a3b38; color: #fff; font-family: "Kantumruy Pro", system-ui, sans-serif; }
    .boot { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(165deg,#d9786c 0%,#9a3b38 42%,#5c1a1c 78%,#3a0f14 100%); position: relative; overflow: hidden; }
    .boot h1 { font-size: 1.85rem; margin: 0; font-weight: 700; }
    .boot p { margin: 0; opacity: .78; }
    .boot-bar { width: min(72vw, 260px); height: 4px; border-radius: 99px; background: #ffffff47; overflow: hidden; margin-top: 20px; }
    .boot-bar > span { display: block; height: 100%; width: 32%; background: #fff; border-radius: inherit; animation: bootfill 1.2s linear infinite; }
    @keyframes bootfill { 0% { width: 8%; } 100% { width: 92%; } }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <h1>ប្រតិទិនខ្មែរ</h1>
    <p>ប្រតិទិនចន្ទគតិខ្មែរ</p>
    <div class="boot-bar" aria-hidden="true"><span></span></div>
  </div>
  <script>
    (function () {
      // Browser haptics bridge for Flutter web. Feature detection is required:
      // unsupported browsers simply return false and do nothing.
      window.__khmerHapticsTick = function () {
        if (!('vibrate' in navigator)) return false;
        try {
          return navigator.vibrate(8);
        } catch (_) {
          return false;
        }
      };

      // Web "update": instead of sending people to GitHub, clear what the browser cached for this
      // site (service workers, Cache Storage) and download the app files again. User data (settings,
      // reminders) lives in localStorage and is not touched.
      window.__khmerRefresh = {
        deployedVersion: async function () {
          try {
            var r = await fetch('version.json?cb=' + Date.now(), { cache: 'no-store' });
            if (!r.ok) return null;
            var j = await r.json();
            return j && j.version ? String(j.version) : null;
          } catch (_) {
            return null;
          }
        },
        cleanAndReload: async function () {
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
          } catch (_) {}
          try {
            if (window.caches) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (_) {}
          try {
            var files = ['./', 'index.html', 'flutter.js', 'flutter_bootstrap.js', 'main.dart.js',
              'manifest.json', 'version.json', 'offline.js', 'flutter_service_worker.js'];
            await Promise.all(files.map(function (f) {
              return fetch(f, { cache: 'reload' }).catch(function () {});
            }));
          } catch (_) {}
          window.location.reload();
        }
      };

      window.__khmerInstall = {
        deferred: null,
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        },
        hasPrompt: function () { return !!window.__khmerInstall.deferred; },
        promptInstall: async function () {
          var e = window.__khmerInstall.deferred;
          if (!e) return false;
          window.__khmerInstall.deferred = null;
          await e.prompt();
          var choice = await e.userChoice;
          return !!(choice && choice.outcome === 'accepted');
        }
      };
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__khmerInstall.deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__khmerInstall.deferred = null;
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('offline.js').catch(function () {});
        });
      }
      window.addEventListener("flutter-first-frame", function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
