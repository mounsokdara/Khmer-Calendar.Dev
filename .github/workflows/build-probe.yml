# Manual: runs the dev release build and publishes the build output to the ci-report-build branch.
name: Build probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khmer-release.keystore"
      - name: Build
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/khmer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          flutter pub get > /tmp/build-report.txt 2>&1
          flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/symbols --build-number=${{ github.run_number }} >> /tmp/build-report.txt 2>&1
          echo "build exit: $?" >> /tmp/build-report.txt
          grep -n "error:\|e: \|FAILURE\|What went wrong\|Execution failed\|Unresolved\|AAPT\|Error:" /tmp/build-report.txt | head -60 > /tmp/build-errors.txt
          tail -80 /tmp/build-report.txt >> /tmp/build-errors.txt
      - name: Publish build probe report (ci-reports/ on main)
        if: always()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch -q origin main
          git checkout -q -B main origin/main
          mkdir -p ci-reports
          cp /tmp/build-errors.txt ci-reports/build-errors.txt 2>/dev/null || echo "no report produced" > ci-reports/build-errors.txt
          git add ci-reports
          git commit -q -m "ci: build probe report ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do git push -q origin main && break; git pull -q --rebase origin main; done
