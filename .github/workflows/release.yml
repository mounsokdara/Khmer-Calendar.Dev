name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to publish (e.g. v1.0.5). Leave empty to use version.txt / current SHA."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: true
permissions:
  contents: write


jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  linux:
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          git archive --format=zip --output KhmerCalendar-project.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: KhmerCalendar-project.zip

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply version.txt
        run: bash scripts/set-version.sh --apply
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build web --release --web-resources-cdn --base-href /
        working-directory: khmer_calendar
      - name: Pack web
        run: |
          (cd khmer_calendar/build/web && zip -r "$GITHUB_WORKSPACE/KhmerCalendar-web.zip" .)
          mkdir -p dist
          cp -a khmer_calendar/build/web/. dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: KhmerCalendar-web.zip

  release:
    needs: [android, linux, windows, macos, project, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage files
        run: |
          mkdir -p release-files
          # Packages + standalone updaters (KhmerCalendar-Updater-*).
          find dist -type f \( \
            -name 'KhmerCalendar-*' -o \
            -name 'KhmerCalendar-Updater-*' \
          \) ! -name '*.idsig' -exec cp -t release-files {} +
          # Portable universal Windows: one flat folder (x64 build).
          # No x64/arm64 subfolders and no launcher — double-click khmer_calendar.exe.
          # Works on ARM64 Windows via built-in x64 emulation.
          if [ -f dist/windows-x64/KhmerCalendar-windows-x64.zip ]; then
            mkdir -p u-win
            unzip -q dist/windows-x64/KhmerCalendar-windows-x64.zip -d u-win
            (cd u-win && zip -qr ../release-files/KhmerCalendar-windows-universal.zip .)
          else
            echo "::warning::windows universal skipped (needs windows-x64 zip)"
          fi
          if [ -f dist/linux-x64/KhmerCalendar-linux-x64.tar.gz ] && [ -f dist/linux-arm64/KhmerCalendar-linux-arm64.tar.gz ]; then
            mkdir -p u-linux/x64 u-linux/arm64
            tar -xzf dist/linux-x64/KhmerCalendar-linux-x64.tar.gz -C u-linux/x64
            tar -xzf dist/linux-arm64/KhmerCalendar-linux-arm64.tar.gz -C u-linux/arm64
            cat > u-linux/khmer-calendar.sh <<'LAUNCHER'
          #!/bin/sh
          here="$(cd "$(dirname "$0")" && pwd)"
          case "$(uname -m)" in
            aarch64|arm64) dir=arm64 ;;
            x86_64|amd64) dir=x64 ;;
            *) echo "Unsupported CPU: $(uname -m)" >&2; exit 1 ;;
          esac
          exec "$here/$dir/khmer_calendar" "$@"
          LAUNCHER
            chmod +x u-linux/khmer-calendar.sh
            tar -C u-linux -czf release-files/KhmerCalendar-linux-universal.tar.gz .
          else
            echo "::warning::linux universal skipped (needs both the x64 and arm64 archives)"
          fi
          ls -lh release-files
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            TAG="${TAG#v}"
            TAG="v${TAG}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -f version.txt ]; then
            VERSION=$(sed -n 's/^versionName=//p' version.txt | head -1 | tr -d '\r')
            TAG="v${VERSION}"
          else
            VERSION=$(grep -m1 '^version:' khmer_calendar/pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
            TAG="v${VERSION}"
          fi

          NOTES_FILE=".github/release-body.md"
          echo "Publishing ${TAG} (target ${GITHUB_SHA})"
          retry() {
            local n=1 max=5
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::giving up after ${max} attempts: $*" >&2
                return 1
              fi
              echo "::warning::attempt ${n}/${max} failed (transient GitHub API error?): $*" >&2
              sleep $((n * 20))
              n=$((n + 1))
            done
          }
          drop_drafts() {
            local ids id
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == true and .tag_name == \"${TAG}\") | .id") || return 1
            for id in $ids; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || return 1
            done
          }
          create_draft() {
            drop_drafts || return 1
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Khmer Calendar $TAG" \
              --notes-file "$NOTES_FILE"
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            retry gh release delete "$TAG" --yes --cleanup-tag
          fi
          retry create_draft
          for f in release-files/*; do
            retry gh release upload "$TAG" "$f" --clobber
          done
          retry gh release edit "$TAG" --draft=false
