name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true
permissions:
  contents: write


jobs:
  # Per-platform build + sign lives in its own file (also runnable on its own).
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The arm64 leg is best-effort so it can never block the x64 release.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, experimental: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      # No Linux arm64 SDK archive is published, so the arm64 leg installs Flutter from git
      # (the tool downloads the native arm64 Dart SDK itself).
      - name: Flutter SDK 3.47.4 from git (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build linux --release
        working-directory: khmer_calendar
      - name: Pack linux
        run: |
          tar -C khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle -czf KhmerCalendar-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: KhmerCalendar-linux-${{ matrix.arch }}.tar.gz

  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          git archive --format=zip --output KhmerCalendar-project.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: KhmerCalendar-project.zip

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build web --release --web-resources-cdn --base-href /
        working-directory: khmer_calendar
      - name: Pack web
        run: |
          (cd khmer_calendar/build/web && zip -r "$GITHUB_WORKSPACE/KhmerCalendar-web.zip" .)
          mkdir -p dist
          cp -a khmer_calendar/build/web/. dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: KhmerCalendar-web.zip

  release:
    needs: [android, linux, windows, macos, project, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage files
        run: |
          mkdir -p release-files
          # Every package job uploads its own file named KhmerCalendar-<os/arch>.<ext>; publish them as separate assets.
          find dist -type f -name 'KhmerCalendar-*' ! -name '*.idsig' -exec cp -t release-files {} +
          ls -lh release-files
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' khmer_calendar/pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
          TAG="v${VERSION}"
          NOTES_FILE=".github/release-body.md"
          echo "Publishing ${TAG}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release-files/* \
            --target "$GITHUB_SHA" \
            --title "Khmer Calendar $TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
