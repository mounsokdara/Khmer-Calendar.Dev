# Desktop builds for the in-app updater (About > Check for updates).
# Packages only — updater binary lives inside each archive (not a separate release asset):
#   KhmerCalendar-windows-{x64,arm64}.zip  (contains update-windows.exe + khmer-calendar-bg.exe)
#   KhmerCalendar-linux-{x64,arm64}.tar.gz (contains update-linux-{arch} + khmer-calendar-bg)
#   KhmerCalendar-macos-{arm64,x86_64,universal}.dmg (contains update-macos.sh; bg helper in .app)
# Also published on their own (download and run, the app does not need to be started):
#   KhmerCalendar-Updater-windows-x64.exe, KhmerCalendar-Updater-linux-{x64,arm64}, KhmerCalendar-Updater-macos.zip
name: Desktop dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "khmer_calendar/**"
      - "scripts/**"
      - "tools/updater/**"
      - "tools/background/**"
      - ".github/workflows/desktop-dev.yml"

concurrency:
  group: desktop-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          architecture: x64
      - run: flutter pub get
        working-directory: khmer_calendar
      - name: Build windows
        shell: pwsh
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows --release 2>&1 | Tee-Object -Variable log | Out-Host
          if ($LASTEXITCODE -ne 0) {
            $tail = (($log | Select-Object -Last 25) -join ' | ') -replace '[\r\n]+', ' '
            Write-Host "::error title=flutter build windows failed::$tail"
            exit 1
          }
      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -Arch ${{ matrix.arch }}
      - name: Build updater into the package folder
        shell: pwsh
        run: dart compile exe tools/updater/update.dart -o khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\update-windows.exe
      - name: Build background service into the package folder
        shell: pwsh
        run: dart compile exe tools/background/bg_service.dart -o khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\khmer-calendar-bg.exe
      - name: Standalone updater copy (separate release asset)
        shell: pwsh
        run: Copy-Item khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\update-windows.exe KhmerCalendar-Updater-windows-${{ matrix.arch }}.exe
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath KhmerCalendar-windows-${{ matrix.arch }}.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip KhmerCalendar-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: KhmerCalendar-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-${{ matrix.arch }}
          path: KhmerCalendar-Updater-windows-${{ matrix.arch }}.exe

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build macos --release
        working-directory: khmer_calendar
      - name: Build background helper into the .app
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          MACOS_DIR="$APP/Contents/MacOS"
          dart compile exe tools/background/bg_service.dart -o "$MACOS_DIR/khmer-calendar-bg"
          chmod +x "$MACOS_DIR/khmer-calendar-bg"
          codesign --force --sign - "$MACOS_DIR/khmer-calendar-bg" || true
      - name: Keep the universal app
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          tar -C "$(dirname "$APP")" -cf macos-app.tar "$(basename "$APP")"
          lipo -archs "$APP/Contents/MacOS/"* || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-app
          path: macos-app.tar
          retention-days: 1

  macos-pack:
    name: macos-${{ matrix.arch }}
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-app
      - name: Thin (if needed), ad-hoc sign and pack (.app + update-macos.sh)
        run: |
          mkdir app && tar -C app -xf macos-app.tar
          APP=$(find app -maxdepth 1 -name "*.app" | head -1)
          if [ "${{ matrix.arch }}" != "universal" ]; then bash scripts/thin-macos.sh "$APP" "${{ matrix.arch }}"; fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmgroot
          mv "$APP" dmgroot/
          cp tools/updater/update-macos.sh dmgroot/update-macos.sh
          chmod +x dmgroot/update-macos.sh
          hdiutil create -volname "Khmer Calendar" -srcfolder dmgroot -ov -format UDZO "KhmerCalendar-macos-${{ matrix.arch }}.dmg"
          ls -lh "KhmerCalendar-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: KhmerCalendar-macos-${{ matrix.arch }}.dmg
      - name: Standalone updater (zip keeps the executable bit; same file for every arch, so only one job makes it)
        if: matrix.arch == 'universal'
        run: |
          mkdir updater-macos
          cp tools/updater/update-macos.sh updater-macos/KhmerCalendar-Updater-macos.command
          chmod +x updater-macos/KhmerCalendar-Updater-macos.command
          (cd updater-macos && zip -q ../KhmerCalendar-Updater-macos.zip KhmerCalendar-Updater-macos.command)
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'universal'
        with:
          name: updater-macos
          path: KhmerCalendar-Updater-macos.zip

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, experimental: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Flutter 3.47.4 (arm64, from git)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
        working-directory: khmer_calendar
      - name: Build linux
        working-directory: khmer_calendar
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "::error title=flutter build linux failed::$(tail -n 25 "$RUNNER_TEMP/build.log" | tr '\n' '|')"
            exit 1
          }
      - name: Build updater into the package folder
        run: |
          dart compile exe tools/updater/update.dart -o khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle/update-linux-${{ matrix.arch }}
          chmod +x khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle/update-linux-${{ matrix.arch }}
      - name: Build background service into the package folder
        run: |
          dart compile exe tools/background/bg_service.dart -o khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle/khmer-calendar-bg
          chmod +x khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle/khmer-calendar-bg
      - name: Standalone updater copy (separate release asset)
        run: cp khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle/update-linux-${{ matrix.arch }} KhmerCalendar-Updater-linux-${{ matrix.arch }}
      - name: Pack linux
        run: tar -C khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle -czf KhmerCalendar-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: KhmerCalendar-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: updater-linux-${{ matrix.arch }}
          path: KhmerCalendar-Updater-linux-${{ matrix.arch }}

  publish:
    needs: [windows, macos-pack, linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload packages and standalone updaters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          find dist -type f \( \
            -name 'KhmerCalendar-windows-*.zip' -o \
            -name 'KhmerCalendar-linux-*.tar.gz' -o \
            -name 'KhmerCalendar-macos-*.dmg' -o \
            -name 'KhmerCalendar-Updater-*' \
          \) -exec cp -t out {} +
          ls -lh out
          if [ -f version.txt ]; then
            VERSION=$(sed -n 's/^versionName=//p' version.txt | head -1 | tr -d '\r')
            TAG="v${VERSION}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "::warning::release $TAG does not exist yet; desktop packages not uploaded"
            fi
          else
            echo "::warning::no version.txt"
          fi
