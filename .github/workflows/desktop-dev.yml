# Desktop dev builds for the in-app updater (About > Check for updates).
# android.yml already refreshes the "dev-latest" pre-release with the Android APKs on every push to main; this file adds
# the desktop packages and their updater programs to that same pre-release:
#   KhmerCalendar-windows-{x64,arm64}.zip   + update-windows.exe
#   KhmerCalendar-linux-{x64,arm64}.tar.gz  + update-linux-{x64,arm64}
#   KhmerCalendar-macos-{arm64,x86_64,universal}.dmg + update-macos.sh
# It does not touch android.yml, release.yml, windows.yml or macos.yml.
# Dev builds are NOT signed with the release certificate: the Dev repo has no DESKTOP_SIGN_* secrets, and windows.yml /
# macos.yml fail without them. Windows is left unsigned; macOS gets an ad-hoc signature (Apple Silicon refuses unsigned code).
# The updater downloads over HTTP, so neither SmartScreen nor Gatekeeper quarantine applies to what it installs.
# Delete this file to stop publishing desktop dev builds.
name: Desktop dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "khmer_calendar/**"
      - "scripts/**"
      - "tools/updater/**"
      - ".github/workflows/desktop-dev.yml"

concurrency:
  group: desktop-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # x64 only: `flutter build windows` has no --target-platform option in this Flutter version, so an arm64 package cannot be
    # built. Windows on ARM runs the x64 build through emulation, and the in-app updater falls back to it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          architecture: x64
      - run: flutter pub get
        working-directory: khmer_calendar
      - name: Build windows
        shell: pwsh
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows --release 2>&1 | Tee-Object -Variable log | Out-Host
          if ($LASTEXITCODE -ne 0) {
            # The job log is hard to reach from outside, an annotation is not.
            $tail = (($log | Select-Object -Last 25) -join ' | ') -replace '[\r\n]+', ' '
            Write-Host "::error title=flutter build windows failed::$tail"
            exit 1
          }
      - name: Bundle Visual C++ runtime (so it runs without the redistributable installed)
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -Arch ${{ matrix.arch }}
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath KhmerCalendar-windows-${{ matrix.arch }}.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip KhmerCalendar-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: KhmerCalendar-windows-${{ matrix.arch }}.zip

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build macos --release
        working-directory: khmer_calendar
      - name: Keep the universal app (tar keeps symlinks and permissions)
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          tar -C "$(dirname "$APP")" -cf macos-app.tar "$(basename "$APP")"
          lipo -archs "$APP/Contents/MacOS/"* || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-app
          path: macos-app.tar
          retention-days: 1

  macos-pack:
    name: macos-${{ matrix.arch }}
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-app
      - name: Thin (if needed), ad-hoc sign and pack
        run: |
          mkdir app && tar -C app -xf macos-app.tar
          APP=$(find app -maxdepth 1 -name "*.app" | head -1)
          if [ "${{ matrix.arch }}" != "universal" ]; then bash scripts/thin-macos.sh "$APP" "${{ matrix.arch }}"; fi
          # Ad-hoc signature ("-"): thinning breaks the old one, and Apple Silicon will not start unsigned code.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          hdiutil create -volname "Khmer Calendar" -srcfolder "$APP" -ov -format UDZO "KhmerCalendar-macos-${{ matrix.arch }}.dmg"
          ls -lh "KhmerCalendar-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: KhmerCalendar-macos-${{ matrix.arch }}.dmg

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The arm64 leg is best-effort so it can never block the rest.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, experimental: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build linux --release
        working-directory: khmer_calendar
      - name: Pack linux
        run: tar -C khmer_calendar/build/linux/${{ matrix.arch }}/release/bundle -czf KhmerCalendar-linux-${{ matrix.arch }}.tar.gz .
      - name: Build the updater
        run: dart compile exe tools/updater/update.dart -o update-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            KhmerCalendar-linux-${{ matrix.arch }}.tar.gz
            update-linux-${{ matrix.arch }}

  updater-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          architecture: x64
      # One x64 updater serves x64 and arm64 Windows (arm64 runs it through emulation).
      - run: dart compile exe tools/updater/update.dart -o update-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-updater-windows
          path: update-windows.exe

  publish:
    needs: [windows, macos-pack, linux, updater-windows]
    # Publish whatever was built, even if a best-effort leg (arm64) failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Wait for this commit's dev-latest pre-release (android.yml creates it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 90); do
            T=$(gh release view dev-latest --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null || true)
            if [ "$T" = "$GITHUB_SHA" ]; then exit 0; fi
            # Run by hand: android.yml did not run for this commit, use the release that exists.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$T" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::dev-latest for $GITHUB_SHA never appeared (android.yml creates it)"
          exit 1
      - name: Upload to dev-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          find dist -type f \( -name 'KhmerCalendar-windows-*.zip' -o -name 'KhmerCalendar-linux-*.tar.gz' -o -name 'KhmerCalendar-macos-*.dmg' \
            -o -name 'update-windows.exe' -o -name 'update-linux-*' \) -exec cp -t out {} +
          cp tools/updater/update-macos.sh out/
          ls -lh out
          gh release upload dev-latest out/* --clobber --repo "$GITHUB_REPOSITORY"
