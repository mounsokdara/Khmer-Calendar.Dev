# Runs the calendar engine tests on the dev repo. Separate file: the release/android workflows are not touched.
name: Calendar tests

on:
  push:
    branches: [main]
    paths:
      - "khmer_calendar/lib/**"
      - "khmer_calendar/test/**"
      - "khmer_calendar/pubspec.yaml"
      - ".github/workflows/calendar-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - name: Analyze and test
        working-directory: khmer_calendar
        run: |
          set +e
          {
            echo "=== flutter analyze ==="
            flutter analyze --no-fatal-infos --no-fatal-warnings lib test
            echo "analyze exit: $?"
            echo "=== flutter test ==="
            flutter test --reporter expanded
            echo "test exit: $?"
          } > /tmp/test-report.txt 2>&1
          cat /tmp/test-report.txt
          grep -q "test exit: 0" /tmp/test-report.txt && ! grep -q "^error" /tmp/test-report.txt
      - name: Publish test report (ci-reports/ on main)
        if: always()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch -q origin main
          git checkout -q -B main origin/main
          mkdir -p ci-reports
          cp /tmp/test-report.txt ci-reports/test-report.txt 2>/dev/null || echo "no report produced" > ci-reports/test-report.txt
          git add ci-reports
          git commit -q -m "ci: test report ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do git push -q origin main && break; git pull -q --rebase origin main; done
