name: Android

on:
  workflow_call:
  workflow_dispatch:
  # Dev: every push to main builds all packages and refreshes the "dev-latest" pre-release.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create dev-latest --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Khmer Calendar DEV (${GITHUB_SHA::7})" \
            --notes "Dev build from main @ ${GITHUB_SHA::7}. One standalone APK per package: arm64 for almost every phone, arm32 for old 32-bit phones, x64 for emulators and Intel Chromebooks, arm32_64 and universal for several ABIs in one file. The name in the file is the package. Same app id as production; uninstall the production app first if the signing key differs." \
            --prerelease

  android:
    name: android-${{ matrix.name }}
    needs: prepare
    # prepare is skipped outside pushes; still run in that case.
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm32,     target: "android-arm",                           mode: release, split: true,  out: app-armeabi-v7a-release.apk, experimental: false }
          - { name: arm64,     target: "android-arm64",                         mode: release, split: true,  out: app-arm64-v8a-release.apk,   experimental: false }
          - { name: x64,       target: "android-x64",                           mode: release, split: true,  out: app-x86_64-release.apk,      experimental: false }
          - { name: arm32_64,  target: "android-arm,android-arm64",             mode: release, split: false, out: app-release.apk,            experimental: false }
          - { name: universal, target: "android-arm,android-arm64,android-x64", mode: release, split: false, out: app-release.apk,            experimental: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      # Gradle's own CMake download sometimes arrives corrupted ("Archive is not a ZIP archive" /
      # "Install CMake 3.22.1 failed"). Install it up front with sdkmanager and retry instead.
      - name: Install Android CMake (with retries)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          for i in 1 2 3 4; do
            rm -rf "$SDK/cmake/3.22.1" "$SDK/.temp" 2>/dev/null || true
            if "$SDKM" --install "cmake;3.22.1" && [ -x "$SDK/cmake/3.22.1/bin/cmake" ]; then
              echo "CMake installed on attempt $i"; exit 0
            fi
            echo "CMake install failed (attempt $i), retrying in $((i*15))s"; sleep $((i*15))
          done
          exit 1
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khmer-release.keystore"
      - run: flutter pub get
        working-directory: khmer_calendar
      # --split-debug-info strips debug symbols from libapp.so; symbols are kept as an artifact.
      # No --build-number: the version code is the one in pubspec.yaml.
      - run: flutter build apk --${{ matrix.mode }} ${{ matrix.split && '--split-per-abi' || '' }} --target-platform ${{ matrix.target }} ${{ matrix.mode == 'release' && '--split-debug-info=build/symbols' || '' }}
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/khmer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Align, sign (v1+v2+v3+v4) + verify
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=khmer_calendar/build/app/outputs/flutter-apk
          KS_FILE="$RUNNER_TEMP/khmer-release.keystore" bash scripts/sign-apk.sh "$OUTDIR/${{ matrix.out }}" "$OUTDIR/KhmerCalendar-${{ matrix.name }}.apk"
          AAPT2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          VC=$([ -n "$AAPT2" ] && "$AAPT2" dump badging "$OUTDIR/KhmerCalendar-${{ matrix.name }}.apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1 || true)
          echo "KhmerCalendar-${{ matrix.name }}.apk versionCode=${VC:-?}"
          echo "::notice title=${{ matrix.name }}::versionCode ${VC:-?}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: khmer_calendar/build/app/outputs/flutter-apk/KhmerCalendar-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'release'
        with:
          name: android-symbols-${{ matrix.name }}
          path: khmer_calendar/build/symbols
      - name: Add to dev-latest pre-release (pushes only)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload dev-latest "khmer_calendar/build/app/outputs/flutter-apk/KhmerCalendar-${{ matrix.name }}.apk" --clobber --repo "$GITHUB_REPOSITORY"
