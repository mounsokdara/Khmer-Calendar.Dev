# Android: build one APK per ABI (armeabi-v7a, arm64-v8a, x86_64), then align, sign (v1+v2+v3+v4) and verify each.
# Only the APKs are shipped; the detached v4 .idsig is verified but not uploaded.
# Runs on its own (Actions tab > Run workflow) or is called by release.yml.
name: Android

on:
  workflow_call:
  workflow_dispatch:
  # Dev: every push to main builds the split APKs and refreshes the "dev-latest" pre-release.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khmer-release.keystore"
      - run: flutter pub get
        working-directory: khmer_calendar
      # arm + arm64 cover every real phone (x86_64 is emulators only, ~1/3 of the old size).
      # --split-debug-info strips debug symbols from libapp.so; symbols are kept as an artifact.
      # Pushes get an increasing build number (run number) so each dev build installs over the last one;
      # release runs keep the version code from pubspec.yaml.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --split-debug-info=build/symbols ${{ github.event_name == 'push' && format('--build-number={0}', github.run_number) || '' }}
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/khmer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Align, sign (v1+v2+v3+v4) + verify APKs
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=khmer_calendar/build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            KS_FILE="$RUNNER_TEMP/khmer-release.keystore" bash scripts/sign-apk.sh "$OUTDIR/app-$abi-release.apk" "$OUTDIR/app-$abi-release-signed.apk"
            mv -f "$OUTDIR/app-$abi-release-signed.apk" "$OUTDIR/app-$abi-release.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: khmer_calendar/build/app/outputs/flutter-apk/app-*-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: khmer_calendar/build/symbols
      - name: Publish dev pre-release (pushes only)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTDIR=khmer_calendar/build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do mv -f "$OUTDIR/app-$abi-release.apk" "$OUTDIR/KhmerCalendar-dev-$abi.apk"; done
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest "$OUTDIR"/KhmerCalendar-dev-*.apk \
            --target "$GITHUB_SHA" --title "Khmer Calendar DEV (build ${{ github.run_number }})" \
            --notes "Dev build from main @ ${GITHUB_SHA::7}. One APK per ABI: arm64-v8a for almost every phone, armeabi-v7a for old 32-bit phones, x86_64 for emulators. Same package as production; uninstall the production app first if the signing key differs." \
            --prerelease
