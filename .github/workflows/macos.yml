# macOS: build once, then pack signed .dmg files. Each volume has the .app
# (with khmer-calendar-bg helper) and update-macos.sh.
name: macOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply version.txt
        run: bash scripts/set-version.sh --apply
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build macos --release
        working-directory: khmer_calendar
      - name: Install arch-independent background helper into the .app
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          MACOS_DIR="$APP/Contents/MacOS"
          # Shell script works on arm64 and x86_64 (dart compile exe is host-arch only).
          cp tools/background/khmer-calendar-bg-macos.sh "$MACOS_DIR/khmer-calendar-bg"
          chmod +x "$MACOS_DIR/khmer-calendar-bg"
      - name: Keep the universal app
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          tar -C "$(dirname "$APP")" -cf macos-app.tar "$(basename "$APP")"
          lipo -archs "$APP/Contents/MacOS/"* || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.tar
          retention-days: 1

  pack:
    name: macos-${{ matrix.arch }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
      - name: Thin (if needed), sign and pack (.app + update-macos.sh)
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: |
          mkdir app && tar -C app -xf macos-app.tar
          APP=$(find app -maxdepth 1 -name "*.app" | head -1)
          if [ "${{ matrix.arch }}" != "universal" ]; then bash scripts/thin-macos.sh "$APP" "${{ matrix.arch }}"; fi
          bash scripts/sign-macos.sh "$APP"
          mkdir dmgroot
          mv "$APP" dmgroot/
          cp tools/updater/update-macos.sh dmgroot/update-macos.sh
          chmod +x dmgroot/update-macos.sh
          hdiutil create -volname "Khmer Calendar" -srcfolder dmgroot -ov -format UDZO "KhmerCalendar-macos-${{ matrix.arch }}.dmg"
          ls -lh "KhmerCalendar-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: KhmerCalendar-macos-${{ matrix.arch }}.dmg
