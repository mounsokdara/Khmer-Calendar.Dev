# Android build of the current public Khmer-Calendar main, production package id.
# Same sign script and plain release build as the video-player app / old calendar release (f112c47). Publishes the rolling pre-release "dev-latest".
# Does not touch the website, Windows, macOS or Linux builds.
name: Android Dev

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: android-dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khmer-release.keystore"
      - run: flutter pub get
        working-directory: khmer_calendar
      # One APK per ABI (no universal): each gets versionCode*10+1/2/3 from build.gradle.kts.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --split-debug-info=build/symbols --build-number=${{ github.run_number }}
        working-directory: khmer_calendar
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/khmer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Sign + verify APKs (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=khmer_calendar/build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            KS_FILE="$RUNNER_TEMP/khmer-release.keystore" bash scripts/sign-apk.sh "$OUTDIR/app-$abi-release.apk" "$OUTDIR/KhmerCalendar-dev-$abi.apk"
          done
          ls -lh "$OUTDIR"/KhmerCalendar-dev-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-dev
          path: khmer_calendar/build/app/outputs/flutter-apk/KhmerCalendar-dev-*.apk
      - name: Publish dev pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest khmer_calendar/build/app/outputs/flutter-apk/KhmerCalendar-dev-*.apk \
            --target "$GITHUB_SHA" --title "Khmer Calendar DEV (build ${{ github.run_number }})" \
            --notes "Dev build from main @ ${GITHUB_SHA::7}. One APK per ABI: arm64-v8a for almost every phone, armeabi-v7a for old 32-bit phones, x86_64 for emulators. Same package as production; uninstall the production app first if the signing key differs." \
            --prerelease
