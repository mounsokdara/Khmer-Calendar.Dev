name: Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, experimental: false }
          - { arch: arm64, runner: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          architecture: x64
      # The x64 Flutter SDK has no --target-platform for Windows, so the ARM runner installs Flutter from git
      # at the same release tag. On an arm64 host, `flutter build windows` builds a native arm64 app by itself.
      - name: Flutter 3.47.4 (arm64, from git)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$env:USERPROFILE\flutter"
          "$env:USERPROFILE\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\flutter\bin\flutter.bat" --version
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build windows --release
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Sign windows (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release
      # After signing on purpose: these are Microsoft-signed and must stay that way.
      - name: Bundle Visual C++ runtime (so it runs without the redistributable installed)
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -Arch ${{ matrix.arch }}
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath KhmerCalendar-windows-${{ matrix.arch }}.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip KhmerCalendar-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: KhmerCalendar-windows-${{ matrix.arch }}.zip
      # Microsoft Store package. Needs the three values from Partner Center (Product >
      # Product identity) saved as repository variables: Settings > Secrets and variables >
      # Actions > Variables. Without them this step is skipped. See docs/WINDOWS-STORE.md.
      - name: Package for Microsoft Store (MSIX)
        if: ${{ matrix.arch == 'x64' && vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        shell: pwsh
        working-directory: khmer_calendar
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ../scripts/package-msix.ps1 -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -OutDir ${{ runner.temp }}\msix
      - name: MSIX skipped (no Store identity yet)
        if: ${{ matrix.arch == 'x64' && (vars.MSIX_IDENTITY_NAME == '' || vars.MSIX_PUBLISHER == '' || vars.MSIX_PUBLISHER_DISPLAY_NAME == '') }}
        shell: pwsh
        run: Write-Host "::notice title=MSIX skipped::Set repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME (see docs/WINDOWS-STORE.md)"
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.arch == 'x64' && vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' }}
        with:
          name: windows-msix
          path: ${{ runner.temp }}\msix\*.msix
          if-no-files-found: error
