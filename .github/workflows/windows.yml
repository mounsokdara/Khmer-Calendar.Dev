# Windows: build, sign, bundle VC++ runtime, pack zip (includes update-windows.exe
# and khmer-calendar-bg.exe). Also uploads a standalone updater exe and the
# portable universal launcher (KhmerCalendar.exe).
name: Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, experimental: false }
          - { arch: arm64, runner: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Apply version.txt
        shell: bash
        run: bash scripts/set-version.sh --apply
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Flutter SDK 3.47.4 from git (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - run: flutter pub get
        working-directory: khmer_calendar
      - name: Build windows
        shell: pwsh
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows --release 2>&1 | Tee-Object -Variable log | Out-Host
          if ($LASTEXITCODE -ne 0) {
            $tail = (($log | Select-Object -Last 25) -join ' | ') -replace '[\r\n]+', ' '
            Write-Host "::error title=flutter build windows failed::$tail"
            exit 1
          }
      - name: Sign windows (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release
      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -Arch ${{ matrix.arch }}
      - name: Build updater into the package folder
        shell: pwsh
        run: dart compile exe tools/updater/update.dart -o khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\update-windows.exe
      - name: Build background service into the package folder
        shell: pwsh
        run: |
          $out = "khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\khmer-calendar-bg.exe"
          dart compile exe tools/background/bg_service.dart -o $out
          ./tools/background/set-gui-subsystem.ps1 -Exe $out
      - name: Standalone updater copy (separate release asset)
        shell: pwsh
        run: Copy-Item khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\update-windows.exe KhmerCalendar-Updater-windows-${{ matrix.arch }}.exe
      - name: Build portable universal launcher (x64 host, runs on ARM64 too via WoW if needed)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          dart compile exe tools/launcher/windows_portable.dart -o KhmerCalendar.exe
          ./tools/background/set-gui-subsystem.ps1 -Exe KhmerCalendar.exe
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath KhmerCalendar-windows-${{ matrix.arch }}.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip KhmerCalendar-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: KhmerCalendar-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: KhmerCalendar-Updater-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: windows-portable-launcher
          path: KhmerCalendar.exe

  installers:
    name: windows-installers
    needs: windows
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply version.txt
        shell: bash
        run: bash scripts/set-version.sh --apply
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: parts
      - name: Unpack the portable builds
        shell: pwsh
        run: |
          foreach ($a in 'x64', 'arm64') {
            $zip = "parts\windows-$a\KhmerCalendar-windows-$a.zip"
            if (Test-Path $zip) { Expand-Archive $zip "build\$a" } else { Write-Host "::warning::$zip missing - no $a installer" }
          }
      - name: Build the setup wizards
        shell: pwsh
        run: |
          $v = ((Select-String -Path khmer_calendar\pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value) -replace '\+.*$',''
          ./scripts/build-installer.ps1 -SourceDir build\x64 -OutDir installer-out -Version $v -Arch x64
          if (Test-Path build\arm64) {
            ./scripts/build-installer.ps1 -SourceDir build\arm64 -OutDir installer-out -Version $v -Arch arm64
            ./scripts/build-installer.ps1 -SourceDir build\x64 -Arm64Dir build\arm64 -OutDir installer-out -Version $v -Arch universal
          }
      - name: Sign the installers (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir installer-out
      - name: Test the x64 installer
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup installer-out\KhmerCalendar-windows-x64-setup.exe
      - name: Test the universal installer
        if: hashFiles('installer-out/KhmerCalendar-windows-universal-setup.exe') != ''
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup installer-out\KhmerCalendar-windows-universal-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installer-out/KhmerCalendar-windows-*-setup.exe
