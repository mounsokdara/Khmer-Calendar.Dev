# Windows: one standalone job per architecture (x64, arm64): build, Authenticode-sign, bundle the Visual C++ runtime,
# then make the portable zip KhmerCalendar-windows-<arch>.zip. The "installers" job then builds the setup
# wizards from those finished builds: KhmerCalendar-windows-x64-setup.exe, -arm64-setup.exe and -universal-setup.exe. The arm64 job is best-effort (continue-on-error) so it can never block a release.
# Runs on its own (Actions tab > Run workflow) or is called by release.yml.
name: Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, experimental: false }
          - { arch: arm64, runner: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      # Flutter builds for the architecture of the machine its own SDK runs on (there is no --target-platform for
# Windows), so the arm64 job needs a native arm64 SDK. No arm64 archive is published, so use git (the tool
      # downloads the native arm64 Dart SDK itself).
      - name: Flutter SDK 3.47.4 from git (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build windows --release
        working-directory: khmer_calendar
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Sign windows (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release
      # After signing on purpose: these are Microsoft-signed and must stay that way.
      - name: Bundle Visual C++ runtime (so it runs without the redistributable installed)
        shell: pwsh
        run: ./scripts/bundle-vcruntime.ps1 -Dir khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release -Arch ${{ matrix.arch }}
      - name: Pack windows
        shell: pwsh
        run: Compress-Archive -Path khmer_calendar\build\windows\${{ matrix.arch }}\runner\Release\* -DestinationPath KhmerCalendar-windows-${{ matrix.arch }}.zip
      - name: Verify package (runtime DLLs + icon)
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Zip KhmerCalendar-windows-${{ matrix.arch }}.zip
      # Setup wizard (Inno Setup): same signed files + runtime as the portable zip.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: KhmerCalendar-windows-${{ matrix.arch }}.zip

  installers:
    # Setup wizards (Inno Setup, runs on any x64 host) built from the finished, signed portable builds,
    # so each installer carries exactly what its zip carries: x64, arm64 and universal (both builds in one setup).
    name: windows-installers
    needs: windows
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: parts
      - name: Unpack the portable builds
        shell: pwsh
        run: |
          foreach ($a in 'x64', 'arm64') {
            $zip = "parts\windows-$a\KhmerCalendar-windows-$a.zip"
            if (Test-Path $zip) { Expand-Archive $zip "build\$a" } else { Write-Host "::warning::$zip missing - no $a installer" }
          }
      - name: Build the setup wizards
        shell: pwsh
        run: |
          $v = ((Select-String -Path khmer_calendar\pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value) -replace '\+.*$',''
          ./scripts/build-installer.ps1 -SourceDir build\x64 -OutDir installer-out -Version $v -Arch x64
          if (Test-Path build\arm64) {
            ./scripts/build-installer.ps1 -SourceDir build\arm64 -OutDir installer-out -Version $v -Arch arm64
            ./scripts/build-installer.ps1 -SourceDir build\x64 -Arm64Dir build\arm64 -OutDir installer-out -Version $v -Arch universal
          }
      - name: Sign the installers (Authenticode)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Dir installer-out
      # This runner is x64: it can install and uninstall the x64 and universal wizards (the universal one picks its x64
      # build here). The arm64 wizard only runs on Arm64 Windows, so it is built and signed but not installed in CI.
      - name: Test the x64 installer (silent install, shortcut, uninstall)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup installer-out\KhmerCalendar-windows-x64-setup.exe
      - name: Test the universal installer (installs the x64 build on this runner)
        if: hashFiles('installer-out/KhmerCalendar-windows-universal-setup.exe') != ''
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup installer-out\KhmerCalendar-windows-universal-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installer-out/KhmerCalendar-windows-*-setup.exe
